name: "Reusable :: Build and Publish Docker images"

on:
  workflow_call:
    secrets:
      GHCR_AUTH_TOKEN:
        required: true

jobs:
  extract-image-tag-from-branch-name:
    name: "Extract tag from branch name"
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.image-tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: "Sanitize branch name"
        id: branch-name-as-tag
        shell: bash
        run: |
          sudo chmod +x ./scripts/ci/gh-actions-get-branch-name.sh
          BRANCH_NAME=$(./scripts/ci/gh-actions-get-branch-name.sh "$GITHUB_EVENT_NAME" "$GITHUB_REF" "$GITHUB_BASE_REF")
          echo "name=${BRANCH_NAME}" >> $GITHUB_OUTPUT

      - name: Set IMAGE_TAG based on branch
        id: image-tag
        env:
          BRANCH_NAME: ${{ steps.branch-name-as-tag.outputs.name }}
        run: |
          if [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            echo "tag=latest" >> $GITHUB_OUTPUT
          else
            echo "tag=wip-${BRANCH_NAME}" >> $GITHUB_OUTPUT
          fi

  build-and-push-hdl-adapter-image:
    permissions:
      contents: read
      packages: write
    name: "Build and push Adapter app image"
    runs-on: ubuntu-latest
    needs: extract-image-tag-from-branch-name
    steps:
      - uses: actions/checkout@v4

      - name: set up docker qemu
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
        with:
          driver-opts: network=host

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Docker metadata for Adapter app
        id: hydration-data-lake-adapter-app-meta
        uses: docker/metadata-action@v4
        with:
          images: |
            ghcr.io/galacticcouncil/data-lake-feed-adapter
          tags: |
            ${{ needs.extract-image-tag-from-branch-name.outputs.tag }}
            ${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Hydration Data Lake Adapter
            org.opencontainers.image.licenses=Apache-2.0 license
            org.opencontainers.image.title=data-lake-feed-adapter

      - name: Build and push Docker image of hydration Data Lake Adapter
        id: hydration-data-lake-adapter-app-push
        uses: docker/build-push-action@v3
        with:
          platforms: linux/amd64,linux/arm64
          file: ./hydration-data-lake-adapter.Dockerfile
          context: ./
          push: true
          tags: ${{ steps.hydration-data-lake-adapter-app-meta.outputs.tags }}
          labels: ${{ steps.hydration-data-lake-adapter-app-meta.outputs.labels }}

  build-and-push-hdl-aggregator-image:
    permissions:
      contents: read
      packages: write
    name: "Build and push Aggregator app image"
    runs-on: ubuntu-latest
    needs: extract-image-tag-from-branch-name
    steps:
      - uses: actions/checkout@v4

      - name: set up docker qemu
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
        with:
          driver-opts: network=host

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Docker metadata for Aggregator app
        id: hydration-data-lake-aggregator-app-meta
        uses: docker/metadata-action@v4
        with:
          images: |
            ghcr.io/galacticcouncil/data-lake-feed-aggregator
          tags: |
            ${{ needs.extract-image-tag-from-branch-name.outputs.tag }}
            ${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Hydration Data Lake Aggregator
            org.opencontainers.image.licenses=Apache-2.0 license
            org.opencontainers.image.title=data-lake-feed-aggregator

      - name: Build and push Docker image of hydration Data Lake Aggregator
        id: hydration-data-lake-aggregator-app-push
        uses: docker/build-push-action@v3
        with:
          platforms: linux/amd64,linux/arm64
          file: ./hydration-data-lake-aggregator.Dockerfile
          context: ./
          push: true
          tags: ${{ steps.hydration-data-lake-aggregator-app-meta.outputs.tags }}
          labels: ${{ steps.hydration-data-lake-aggregator-app-meta.outputs.labels }}
