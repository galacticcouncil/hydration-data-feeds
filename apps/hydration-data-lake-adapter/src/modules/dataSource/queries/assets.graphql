query GetAsset($id: String!) {
  asset(id: $id) {
    id
    name
    symbol
    totalSupply
    circulatingSupply
    decimals
    coinGeckoId
    coinMarketCapId
    metadata
  }
}

query GetAssets($ids: [String!]!) {
  assets(ids: $ids) {
    id
    name
    symbol
    totalSupply
    circulatingSupply
    decimals
    coinGeckoId
    coinMarketCapId
    metadata
  }
}
